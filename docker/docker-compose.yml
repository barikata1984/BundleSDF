services:
  bundlesdf-blackwell:
    build:
      context: ..
      dockerfile: docker/dockerfile
    image: bundlesdf-blackwell
    runtime: nvidia
    ipc: host
    network_mode: host
    volumes:
      - ..:/workspace/BundleSDF
      #  - /home:/home
      #  - /mnt:/mnt
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    working_dir: /workspace/BundleSDF
    command: /bin/bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
