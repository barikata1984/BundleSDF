services:
  bundlesdf-blackwell:
    build:
      context: ..
      dockerfile: docker/dockerfile
      args:
        BASE_IMAGE: osx_robot_env:22-12-2025
    image: bundlesdf-blackwell
    privileged: true
    container_name: bundlesdf-blackwell
    runtime: nvidia
    ipc: host
    network_mode: host
    volumes:
      - /home/atsushi/workspace/BundleSDF/:/workspace/BundleSDF
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /home/atsushi/.cache/huggingface:/root/.cache/huggingface
      - /tmp/.docker.xauth:/tmp/.docker.xauth # ホストで生成する認証ファイルをマウント
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - XAUTHORITY=/tmp/.docker.xauth # コンテナ内の認証ファイルのパスを指定
      # - LD_LIBRARY_PATH=/usr/local/lib/python3.12/dist-packages/torch/lib:/usr/local/cuda/lib64
    working_dir: /workspace/BundleSDF
    command: tail -f /dev/null # これを追加（既存の command: /bin/bash を書き換え）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    shm_size: "16gb"
